
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shajid Money Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body {
  margin: 0;
  padding: 25px 18px;
  background: #102b25;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
.card {
  background: #1b4035;
  padding: 25px;
  border-radius: 18px;
  margin-top: 35px;
}
button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #20c477;
  color: white;
  font-size: 16px;
  margin-top: 15px;
}
#mainApp {
  display: none;
}
#message {
  margin-top: 15px;
}
</style>
</head>
<body>

<h1>Shajid Money Hub</h1>
<p>Earn • Learn • Grow</p>

<div class="card" id="joinCard">
  <h2>Welcome!</h2>
  <p>অ্যাপ ব্যবহার করতে আগে আমাদের গ্রুপে Join করো।</p>

  <button onclick="joinGroup()">👥 Join Telegram Group</button>
  <button onclick="verifyMembership()">✅ Verify Membership</button>

  <p id="message"></p>
</div>

<div class="card" id="mainApp">
  <h2>🎉 Welcome to Shajid Money Hub!</h2>
  <p>তোমার গ্রুপের সদস্যতা যাচাই হয়েছে।</p>
  <p>মূল অ্যাপের কাজ এখানে যোগ করা হবে।</p>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const API_URL = "https://shajidmoneyhubbot-2.onrender.com/verify";

function joinGroup() {
  tg.openTelegramLink("https://t.me/OnlineEarningAlltime4t4");
}

async function verifyMembership() {
  const message = document.getElementById("message");
  const button = document.querySelectorAll("button")[1];

  if (!tg.initData) {
    message.textContent = "Telegram-এর ভিতর থেকে Mini App খুলুন।";
    return;
  }

  button.disabled = true;
  message.textContent = "Checking membership...";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        initData: tg.initData
      })
    });

    const result = await response.json();

    if (response.ok && result.joined) {
      document.getElementById("joinCard").style.display = "none";
      document.getElementById("mainApp").style.display = "block";
    } else if (response.ok && !result.joined) {
      message.textContent = "তুমি এখনো গ্রুপে Join করোনি। আগে Join করো।";
    } else {
      message.textContent = "যাচাই করা যায়নি। আবার চেষ্টা করো।";
    }

  } catch (error) {
    message.textContent = "সার্ভারের সাথে সংযোগ হচ্ছে না। একটু পরে চেষ্টা করো।";
  }

  button.disabled = false;
}
</script>

</body>
</html>
